name: Tests

# Two layers, both fully offline (no Neon, no Groq, no model downloads):
#   api     - pytest over the real FastAPI app with an in-memory database and stubbed model
#             services, the fusion maths, the crisis rules, and a reproduction of the headline
#             accuracy from the committed benchmark data; plus the two research check scripts.
#   browser - Playwright drives the REAL React frontend in Chromium against that same app, the way
#             a user does: sign up, journal, "why?", dashboard, language switch, phone screen.
# Runs on every push and pull request, so a change that breaks the app or the paper's numbers
# shows up here before (or alongside) the deploy workflows.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: API, fusion, crisis and reproducibility tests
        run: python -m pytest tests --ignore=tests/e2e -q

      - name: Prompt-injection checks (85)
        env:
          GROQ_API_KEY: ci-dummy
          MESSAGE_ENCRYPTION_KEY: bW9vZHNjcmlwdC1jaS1kdW1teS1rZXktMzJieXRlcyE=
        run: python research/test_prompt_safety.py

      - name: Mood-arc soundtrack checks
        env:
          GROQ_API_KEY: ci-dummy
        run: python research/test_music_arc.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-e2e.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: pip install -r requirements-e2e.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Browser tests
        run: python -m pytest tests/e2e -q
